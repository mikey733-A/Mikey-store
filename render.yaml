services:
  - type: web
    name: mikey-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TRANZILA_TERMINAL
        sync: false
      - key: TRANZILA_APP_KEY
        sync: false
      - key: TRANZILA_SECRET
        sync: false
      - key: TRANZILA_HANDSHAKE_ENABLED
        value: "false"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mikey-store-db
          property: connectionString
databases:
  - name: mikey-store-db
    databaseName: mikey_store
    user: mikey_store
    play: free 
