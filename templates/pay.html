<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>الدفع</title></head><body><main class="pay"><h1>دفع آمن — MIKEY STORE</h1><p>الطلب #{{order.id}} — <b>{{order.total}} ₪</b></p><iframe name="tranzila" class="payframe"></iframe><form id="payform" action="https://direct.tranzila.com/{{terminal}}/iframenew.php" method="POST" target="tranzila">
