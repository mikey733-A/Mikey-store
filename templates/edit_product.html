<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"><title>تعديل المنتج</title></head><body><main class="login"><h1>تعديل المنتج</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input name="name" value="{{p.name}}" required><input name="category" value="{{p.category}}" required><input name="price" type="number" step=".01" value="{{p.price}}" required><input name="old_price" type="number" step=".01" value="{{p.old_price or ''}}"><input name="stock" type="number" min="0" value="{{p.stock}}" required><input name="image_url" placeholder="رابط صورة جديد اختياري"><input name="image_file" type="file" accept=".png,.jpg,.jpeg,.webp"><textarea name="description">{{p.description}}</textarea><label><input type="checkbox" name="active" {% if p.active %}checked{% endif %}> المنتج ظاهر في المتجر</label><button>حفظ التعديلات</button></form><p><a href="/admin">العودة</a></p></main></body></html>
