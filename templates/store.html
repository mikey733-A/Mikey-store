<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIKEY STORE</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><b>MIKEY STORE <small>ميكي ستور</small></b><button onclick="openCart()">🛒 السلة <span id="count">0</span></button></header>
<section class="hero"><h1>تسوّق بذكاء.<br>وصل طلبك لباب البيت.</h1><p>منتجات مختارة وتجربة شراء بسيطة وآمنة.</p></section>
<main><div class="filters"><input id="q" oninput="render()" placeholder="🔎 ابحث"><select id="cat" onchange="render()"><option value="">كل الأقسام</option><option>السيارة</option><option>المنزل</option><option>إكسسوارات</option></select></div><div class="grid" id="grid"></div></main>
<aside id="drawer"><button onclick="closeCart()">×</button><h2>السلة</h2><div id="cart"></div><div id="checkout"></div></aside>
<script>
const P={{products|tojson}};let C=[];
function img(v){return v&&v.startsWith('http')?`<img src="${v}" alt="">`:v||'📦'}
function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value;grid.innerHTML=P.filter(p=>(!c||p.category==c)&&p.name.toLowerCase().includes(q)).map(p=>`<article><div class="pic">${img(p.image)}</div><h3>${p.name}</h3><small>${p.category}</small><p>${p.description||''}</p><h3>${p.price} ₪</h3><button onclick="add(${p.id})" ${p.stock<1?'disabled':''}>${p.stock<1?'نفد المخزون':'أضف للسلة'}</button></article>`).join('')}
function add(id){let p=P.find(x=>x.id==id),x=C.find(i=>i.id==id);if(!p||p.stock<1)return;if(x&&x.quantity>=p.stock)return alert('لا توجد كمية إضافية');x?x.quantity++:C.push({id,quantity:1});update();openCart()}
function update(){count.textContent=C.reduce((a,x)=>a+x.quantity,0);let t=0;cart.innerHTML=C.map(x=>{let p=P.find(y=>y.id==x.id);t+=Number(p.price)*x.quantity;return `<div class=item><span>${p.name} × ${x.quantity}</span><b>${Number(p.price)*x.quantity} ₪</b></div>`}).join('')||'<p>السلة فارغة</p>';checkout.innerHTML=C.length?`<h3>الإجمالي مع الشحن: ${t+25} ₪</h3><input id=n placeholder="الاسم"><input id=ph placeholder="الهاتف"><input id=ci placeholder="المدينة"><input id=ad placeholder="العنوان"><select id=pm><option value=cod>الدفع عند الاستلام</option><option value=card>بطاقة ائتمان — دفع مستضاف وآمن</option></select><button onclick="order()">تأكيد الطلب</button>`:''}
async function order(){let d={name:n.value,phone:ph.value,city:ci.value,address:ad.value,payment_method:pm.value,items:C};let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)return alert(j.error);if(j.payment_url)location=j.payment_url;else{if(j.whatsapp)window.open(j.whatsapp,'_blank');alert('تم تسجيل الطلب #'+j.order_id);C=[];update();closeCart()}}
function openCart(){drawer.classList.add('on');update()}function closeCart(){drawer.classList.remove('on')}render();update()
</script></body></html>
